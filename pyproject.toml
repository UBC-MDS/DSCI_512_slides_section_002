[project]
name = "dsci-512-slides-section-002"
version = "0.1.0"
description = "Slides for DSCI 512 (Algorithms and Data Structures) Section 002"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter-client>=8.10.0",
    "line-profiler>=5.0.2",
    "memory-profiler>=0.61.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "pulp>=3.3.2,<4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

# Only needed by scripts/generate_images.py, not by `quarto render`.
# Install with: uv sync --group images
[dependency-groups]
images = [
    "openai>=2.9.0",
    "python-dotenv>=1.1.0",
]
